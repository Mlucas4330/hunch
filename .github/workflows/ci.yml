name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hunch
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hunch
      AUTH_SECRET: ci-only-not-a-real-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-not-a-real-password
      # No scraping and no Claude calls: playwright.config.ts sets E2E_FIXTURES for its own server,
      # so the suite never needs an API key. BROWSER_URL stays unset, which keeps launchBrowser on
      # its local-launch path if anything does reach it.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run db:push

      - run: npm run typecheck

      # A security assertion, not a lint: it proves the SSRF guard still refuses private,
      # loopback and encoded-IP targets.
      - run: npm run check:url-guard

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
