services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hunch
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Required, not optional. The comment here used to say this service did nothing until you filled in
  # REDIS_URL, which stopped being true when the analysis queue landed: with it empty every analysis
  # answers 503 and the Analyze button just returns you to the dashboard. See docs/development.md.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
